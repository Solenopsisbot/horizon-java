name: ci

# The gates every change must pass: formatting, clippy with warnings denied,
# the Rust tests and the corpus tools' Python tests. Corpus measurements need
# jars and a Horizon build, so they run elsewhere (real-mod-corpus.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Vendored runtime
        # `mod/src/runtime/` is a copy of `crates/horizon-native-java/src` (the native mod is one
        # crate). Every PR and push must carry the copy its runtime vendors to: `--check`
        # regenerates it and compares byte for byte, which catches a hand edit to the copy and a
        # runtime change that was not re-vendored alike. Fix with `python3 tools/vendor.py`.
        run: python3 tools/vendor.py --check
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --locked
      - name: Python tests
        # The fixture tests look for the debug binaries the step above built.
        run: python3 -m unittest discover -s tests

  # `mod/` is excluded from the workspace (the launcher builds it against Horizon's own lock), so
  # the workspace gates above never compile it. This job does, so a mod PR's green check means the
  # mod's code builds, lints clean and passes its unit tests.
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mod
      - name: Format (mod's own files)
        # mod/src/runtime/ is generated by tools/vendor.py (its `crate::` paths are rewritten, which
        # changes line lengths), so only the mod's own files are formatted; the vendored copy is
        # checked by `vendor.py --check` in the gates job.
        run: find mod/src -maxdepth 1 -name '*.rs' -print0 | xargs -0 rustfmt +stable --edition 2024 --check --config skip_children=true
      - name: Clippy (mod)
        run: cargo +stable clippy --manifest-path mod/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests (mod)
        run: cargo +stable test --manifest-path mod/Cargo.toml --lib
